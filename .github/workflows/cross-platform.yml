name: Cross-platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        # Explicit bash uses -e -o pipefail on every runner, so an early
        # npm failure cannot be hidden by a later successful command.
        shell: bash
        working-directory: Vibe-Deep-Research
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 = engines 允许的最低大版本（≥22.18 原生类型剥离默认开启），24 = 推荐版本（#38）
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: Vibe-Deep-Research
      # 用户需配置 CROSS_REPO_READ_TOKEN（两仓 contents:read）和 SIBLING_REF；不使用产品凭据。
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SIBLING_REPOSITORY || 'chen-cheng/Stock-Research' }}
          ref: ${{ vars.SIBLING_REF }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: Stock-Research
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            Vibe-Deep-Research/orchestrator/package-lock.json
            Vibe-Deep-Research/desktop/package-lock.json
      - name: Install Node dependencies
        run: |
          npm ci --prefix orchestrator
          npm ci --prefix desktop
      - name: Repository gates (protocol, docs layout, invariants)
        run: |
          node scripts/verify-protocol.mjs
          node scripts/verify-docs.mjs
          node scripts/verify-invariants.mjs
          node --test scripts/verify-protocol.test.mjs scripts/verify-invariants.test.mjs
          node --test ../Stock-Research/dsh/test/tool-boundary.test.mjs
      - name: Orchestrator full suite and typecheck
        if: runner.os != 'Windows'
        run: |
          npm test --prefix orchestrator
          npm run typecheck --prefix orchestrator
      - name: Orchestrator Windows contract and typecheck
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test --test-concurrency=1 orchestrator/test/windows_support.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck --prefix orchestrator
      - name: Desktop tests and build
        run: |
          npm test --prefix desktop
          npm run build --prefix desktop
      - name: Parse Windows PowerShell entrypoints
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
